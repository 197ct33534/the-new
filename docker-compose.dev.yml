# Dev: hot reload, không cần rebuild image khi sửa code.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build web db
#
# (Tuỳ chọn bỏ cron; hoặc up toàn stack — cron vẫn gọi http://web:3000)
#
# File watch trên Docker Desktop (Windows): đã bật polling; vẫn có thể chậm hơn npm run dev trực tiếp trên máy.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: the-new-web-dev
    container_name: the-new-web-dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-the_new}:${POSTGRES_PASSWORD:-the_new_secret}@db:5432/${POSTGRES_DB:-football_news}?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      CRON_SECRET: ${CRON_SECRET:-dev-cron-secret-change-in-production}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - .:/app
      - web_dev_node_modules:/app/node_modules
      - web_dev_next:/app/.next
      - article_uploads:/app/public/uploads
    entrypoint: ["/bin/sh", "/app/docker/dev-watch-entrypoint.sh"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s

volumes:
  web_dev_node_modules:
  web_dev_next:
